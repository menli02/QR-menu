# catalog rpc service — local dev config. Production values are supplied by
# a Kubernetes ConfigMap/Secret and an Etcd/DNS endpoint inside the cluster,
# never by this file. See docs/TZ.md §7.1, deploy/docker-compose.yml.
Name: catalog.rpc
Mode: dev # enables gRPC reflection so `grpcurl` (README prerequisites) works without a .proto file
ListenOn: 0.0.0.0:8082
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: catalog.rpc
Timeout: 3000

Postgres:
  DataSource: postgres://qrmenu:qrmenu@127.0.0.1:5437/catalog_db?sslmode=disable

MinIO:
  Endpoint: 127.0.0.1:9000
  AccessKey: qrmenu
  SecretKey: qrmenu-dev-only
  Bucket: catalog-images
  UseSSL: false

# Empty in local dev: outbox rows still accumulate in catalog_db and can
# be inspected there, but nothing tries to reach a broker that isn't
# running. To exercise the relay locally, run `make kafka-topics` and set
# this to ["127.0.0.1:9094"] (compose's host-reachable listener; services
# running *inside* compose use ["kafka:9092"] instead).
KafkaBrokers: []

Outbox:
  PollIntervalMs: 500
  BatchSize: 100
  MaxAttempts: 5   # docs/TZ.md §8.3: 5 attempts, then the DLQ

# go-zero's admin server: /healthz (liveness) and /metrics (Prometheus).
# Ports differ per service because local dev runs all four on one
# host; the Kubernetes ConfigMaps use a uniform 6060/6061, since each
# pod has its own network namespace (see deploy/k8s).
# It must be declared explicitly — its fields carry defaults, but with the
# whole block absent go-zero never descends into it and the server does not
# start at all. Verified: without this, nothing listens on 6060.
DevServer:
  Enabled: true
  Port: 6062
  HealthPath: /healthz
  MetricsPath: /metrics
  EnableMetrics: true
  # pprof stays on: this port is never exposed outside the cluster (see
  # deploy/k8s), and a heap profile from a misbehaving pod is worth far
  # more than the bytes the handler costs.
  EnablePprof: true

# GET /readyz — dependency-aware, drives the Kubernetes startup probe.
ReadinessPort: 6063
