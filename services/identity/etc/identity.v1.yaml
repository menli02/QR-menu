# identity rpc service — local dev config. Production values are supplied
# by a Kubernetes ConfigMap/Secret and an Etcd/DNS endpoint inside the
# cluster, never by this file. See docs/TZ.md §7.1, §11, deploy/docker-compose.yml.
Name: identity.rpc
Mode: dev # enables gRPC reflection so `grpcurl` (README prerequisites) works without a .proto file
ListenOn: 0.0.0.0:8081
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: identity.rpc
Timeout: 3000

Postgres:
  DataSource: postgres://qrmenu:qrmenu@127.0.0.1:5437/identity_db?sslmode=disable

# PrivateKeyPath is generated on first boot if missing (see config.go) and
# gitignored (*.pem) — never a real signing key in a committed file. In
# Kubernetes this path is a mounted Secret volume instead.
JWT:
  PrivateKeyPath: .local/identity-signing-key.pem
  AccessExpireSeconds: 900       # staff access token, 15 min
  RefreshExpireSeconds: 604800   # staff refresh token, 7 days
  GuestTokenTTLSeconds: 14400    # guest token, 4h sliding (FR-O1)

# go-zero's admin server: /healthz (liveness) and /metrics (Prometheus).
# Ports differ per service because local dev runs all four on one
# host; the Kubernetes ConfigMaps use a uniform 6060/6061, since each
# pod has its own network namespace (see deploy/k8s).
# It must be declared explicitly — its fields carry defaults, but with the
# whole block absent go-zero never descends into it and the server does not
# start at all. Verified: without this, nothing listens on 6060.
DevServer:
  Enabled: true
  Port: 6060
  HealthPath: /healthz
  MetricsPath: /metrics
  EnableMetrics: true
  # pprof stays on: this port is never exposed outside the cluster (see
  # deploy/k8s), and a heap profile from a misbehaving pod is worth far
  # more than the bytes the handler costs.
  EnablePprof: true

# GET /readyz — dependency-aware, drives the Kubernetes startup probe.
ReadinessPort: 6061
