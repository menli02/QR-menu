# order rpc service — local dev config. Production values are supplied by
# a Kubernetes ConfigMap/Secret and an Etcd/DNS endpoint inside the cluster,
# never by this file. See docs/TZ.md §7.1, deploy/docker-compose.yml.
Name: order.rpc
Mode: dev # enables gRPC reflection so `grpcurl` (README prerequisites) works without a .proto file
ListenOn: 0.0.0.0:8083
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: order.rpc
Timeout: 3000

Postgres:
  DataSource: postgres://qrmenu:qrmenu@127.0.0.1:5437/order_db?sslmode=disable

CatalogRpc:
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: catalog.rpc
  NonBlock: true
  Timeout: 800   # rpc->rpc budget per docs/TZ.md §7.4

# Empty in local dev: outbox rows still accumulate in order_db and can be
# inspected there, but nothing tries to reach a broker that isn't running.
# To exercise the relay locally, run `make kafka-topics` and set this to
# ["127.0.0.1:9094"] (compose's host-reachable listener; services running
# *inside* compose use ["kafka:9092"] instead).
KafkaBrokers: []

Outbox:
  PollIntervalMs: 500
  BatchSize: 100
  MaxAttempts: 5   # docs/TZ.md §8.3: 5 attempts, then the DLQ

# Must match identity's guest token TTL (FR-O1: 4h).
GuestSessionTTLSeconds: 14400
# FR-S4: an unattended call-waiter / request-bill expires after 15 min.
ServiceRequestTTLSeconds: 900
# How long a cached copy of a venue's order limits may be stale. Nothing
# priced is cached — see services/order/internal/venue.
VenueSettingsCacheSeconds: 60
