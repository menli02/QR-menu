# gateway rest service — local dev config. Production values are supplied
# by a Kubernetes ConfigMap/Secret; the only publicly-exposed component
# (docs/TZ.md §7.1). See deploy/docker-compose.yml.
Name: gateway-api
Host: 0.0.0.0
Port: 8888
Timeout: 10000   # browser->gateway budget, docs/TZ.md §7.4

CatalogRpc:
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: catalog.rpc
  NonBlock: true
  Timeout: 3000  # gateway->rpc budget, docs/TZ.md §7.4

OrderRpc:
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: order.rpc
  NonBlock: true
  Timeout: 3000

IdentityRpc:
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: identity.rpc
  NonBlock: true
  Timeout: 3000

Redis:
  Host: 127.0.0.1:6379
  Type: node

JWKSRefreshSeconds: 300

# Realtime push (docs/TZ.md §7.3). Empty brokers disables it: REST works,
# sockets connect and receive nothing, and clients fall back to polling —
# a usable local-dev state. To exercise it, run `make kafka-topics` and set
# this to ["127.0.0.1:9094"] (compose's host-reachable listener; inside
# compose use ["kafka:9092"]).
KafkaBrokers: []
# Every gateway instance consumes with its OWN group so all of them see
# every event — a socket lives on exactly one pod. InstanceID defaults to
# HOSTNAME, which Kubernetes sets to the pod name.
KafkaGroupPrefix: gateway

# WebSocket handshake origin allow-list. Empty permits same-origin only,
# which is right when the frontends are served from this host. Browsers do
# not apply the same-origin policy to WebSocket upgrades, so this matters.
WSAllowedOrigins: []

# go-zero's admin server: /healthz (liveness) and /metrics (Prometheus).
# Ports differ per service because local dev runs all four on one
# host; the Kubernetes ConfigMaps use a uniform 6060/6061, since each
# pod has its own network namespace (see deploy/k8s).
# It must be declared explicitly — its fields carry defaults, but with the
# whole block absent go-zero never descends into it and the server does not
# start at all. Verified: without this, nothing listens on 6060.
DevServer:
  Enabled: true
  Port: 6066
  HealthPath: /healthz
  MetricsPath: /metrics
  EnableMetrics: true
  # pprof stays on: this port is never exposed outside the cluster (see
  # deploy/k8s), and a heap profile from a misbehaving pod is worth far
  # more than the bytes the handler costs.
  EnablePprof: true

# GET /readyz — dependency-aware, drives the Kubernetes startup probe.
ReadinessPort: 6067
