# TEMPLATE ONLY — every value here is a placeholder.
#
# This file is committed so the *shape* of each Secret is reviewable: which
# keys exist, which service consumes them, what each one is for. It is
# deliberately excluded from kustomization.yaml so `kubectl apply -k` can
# never install these placeholders over real credentials.
#
# Do not fill this in and commit it. Supply the real values through
# whatever the cluster already uses — Sealed Secrets, External Secrets
# against a vault, SOPS, or an out-of-band `kubectl create secret`. A
# password in git is a password published, and rotating it afterwards does
# not remove it from the history.
#
# Generating the signing key (once per environment, never per pod):
#
#   openssl genrsa -out signing-key.pem 2048
#   kubectl -n qrmenu create secret generic identity-signing-key \
#     --from-file=signing-key.pem=signing-key.pem
#   shred -u signing-key.pem
#
# That key is the root of trust for every staff and guest token in the
# system. Anyone holding it can mint a token for any venue and any role.
---
apiVersion: v1
kind: Secret
metadata:
  name: identity-secrets
  namespace: qrmenu
type: Opaque
stringData:
  postgres-dsn: "postgres://<DB_USER>:<DB_PASSWORD>@postgres.qrmenu.svc.cluster.local:5432/identity_db?sslmode=require"
---
apiVersion: v1
kind: Secret
metadata:
  name: identity-signing-key
  namespace: qrmenu
type: Opaque
stringData:
  # PEM-encoded RSA private key. All identity replicas must mount the SAME
  # one: the service loads whatever is at this path and only generates a
  # key when the file is absent, so a per-pod key would mean each replica
  # signing with a different one and demoting the others in signing_keys.
  signing-key.pem: |
    -----BEGIN RSA PRIVATE KEY-----
    <IDENTITY_SIGNING_KEY_PEM>
    -----END RSA PRIVATE KEY-----
---
apiVersion: v1
kind: Secret
metadata:
  name: catalog-secrets
  namespace: qrmenu
type: Opaque
stringData:
  postgres-dsn: "postgres://<DB_USER>:<DB_PASSWORD>@postgres.qrmenu.svc.cluster.local:5432/catalog_db?sslmode=require"
  minio-access-key: "<MINIO_ACCESS_KEY>"
  minio-secret-key: "<MINIO_SECRET_KEY>"
---
apiVersion: v1
kind: Secret
metadata:
  name: order-secrets
  namespace: qrmenu
type: Opaque
stringData:
  postgres-dsn: "postgres://<DB_USER>:<DB_PASSWORD>@postgres.qrmenu.svc.cluster.local:5432/order_db?sslmode=require"
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
  namespace: qrmenu
type: Opaque
stringData:
  redis-password: "<REDIS_PASSWORD>"
---
apiVersion: v1
kind: Secret
metadata:
  name: migrate-secrets
  namespace: qrmenu
type: Opaque
stringData:
  # The migration job connects as a role that may DDL, which the services
  # themselves should not be able to do. Separate credentials keep a
  # compromised service pod from dropping a table.
  catalog-dsn: "postgres://<MIGRATOR_USER>:<MIGRATOR_PASSWORD>@postgres.qrmenu.svc.cluster.local:5432/catalog_db?sslmode=require"
  order-dsn: "postgres://<MIGRATOR_USER>:<MIGRATOR_PASSWORD>@postgres.qrmenu.svc.cluster.local:5432/order_db?sslmode=require"
  identity-dsn: "postgres://<MIGRATOR_USER>:<MIGRATOR_PASSWORD>@postgres.qrmenu.svc.cluster.local:5432/identity_db?sslmode=require"
