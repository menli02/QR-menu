apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: qrmenu
  labels: {app.kubernetes.io/part-of: qrmenu, app.kubernetes.io/name: catalog}
spec:
  # Read-dominated (docs/TZ.md §7.1): every guest loading a menu hits this,
  # so it carries the most replicas of the three rpc services.
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: catalog}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: qrmenu, app.kubernetes.io/name: catalog}
      annotations:
        checksum/config: "REPLACE_ON_APPLY"
        prometheus.io/scrape: "true"
        prometheus.io/port: "6060"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: qrmenu
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: catalog}
      containers:
        - name: catalog
          image: ghcr.io/menli02/qr-menu-catalog:latest
          args: ["-f", "/app/etc/catalog.v1.yaml"]
          ports:
            - {name: grpc, containerPort: 8082}
            - {name: admin, containerPort: 6060}
            - {name: readiness, containerPort: 6061}
          env:
            - name: CATALOG_POSTGRES_DSN
              valueFrom:
                secretKeyRef: {name: catalog-secrets, key: postgres-dsn}
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: catalog-secrets, key: minio-access-key}
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: catalog-secrets, key: minio-secret-key}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 96Mi}
            limits: {memory: 384Mi}
          startupProbe:
            httpGet: {path: /readyz, port: readiness}
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet: {path: /healthz, port: admin}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /healthz, port: admin}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - {name: config, mountPath: /app/etc, readOnly: true}
      volumes:
        - name: config
          configMap: {name: catalog-config}
      # This pod runs the outbox relay alongside the RPC server. The relay
      # holds a Postgres transaction open across each Kafka publish (see
      # pkg/outbox), so the grace period has to comfortably exceed one
      # publish round trip — a SIGKILL mid-sweep rolls the transaction
      # back, which is safe but leaves the rows for another worker to
      # re-claim.
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: qrmenu
  labels: {app.kubernetes.io/part-of: qrmenu, app.kubernetes.io/name: catalog}
spec:
  # Headless: discovery is etcd's job. See identity.yaml for why a
  # ClusterIP in front of gRPC pins each client to one backend.
  clusterIP: None
  selector: {app.kubernetes.io/name: catalog}
  ports:
    - {name: grpc, port: 8082, targetPort: grpc}
    - {name: admin, port: 6060, targetPort: admin}
