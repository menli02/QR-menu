apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  namespace: qrmenu
  labels: {app.kubernetes.io/part-of: qrmenu, app.kubernetes.io/name: order}
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: order}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # The transactional core (docs/TZ.md §7.1). Nothing can be ordered,
      # transitioned or paid while this is down, so a rollout never takes
      # capacity below the declared count.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: qrmenu, app.kubernetes.io/name: order}
      annotations:
        checksum/config: "REPLACE_ON_APPLY"
        prometheus.io/scrape: "true"
        prometheus.io/port: "6060"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: qrmenu
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: order}
      containers:
        - name: order
          image: ghcr.io/menli02/qr-menu-order:latest
          args: ["-f", "/app/etc/order.v1.yaml"]
          ports:
            - {name: grpc, containerPort: 8083}
            - {name: admin, containerPort: 6060}
            - {name: readiness, containerPort: 6061}
          env:
            - name: ORDER_POSTGRES_DSN
              valueFrom:
                secretKeyRef: {name: order-secrets, key: postgres-dsn}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            # Highest request of the three: every order write is a
            # multi-statement transaction, and CreateOrder additionally
            # blocks on a catalog round trip.
            requests: {cpu: 150m, memory: 128Mi}
            limits: {memory: 512Mi}
          startupProbe:
            httpGet: {path: /readyz, port: readiness}
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet: {path: /healthz, port: admin}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /healthz, port: admin}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - {name: config, mountPath: /app/etc, readOnly: true}
      volumes:
        - name: config
          configMap: {name: order-config}
      # Long enough for an in-flight CreateOrder transaction (which
      # includes an 800ms catalog call) and one outbox relay sweep to
      # finish. A transaction killed mid-flight rolls back cleanly — the
      # idempotency claim rolls back with it, so the client's retry
      # succeeds — but finishing is strictly better than retrying.
      terminationGracePeriodSeconds: 45
---
apiVersion: v1
kind: Service
metadata:
  name: order
  namespace: qrmenu
  labels: {app.kubernetes.io/part-of: qrmenu, app.kubernetes.io/name: order}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: order}
  ports:
    - {name: grpc, port: 8083, targetPort: grpc}
    - {name: admin, port: 6060, targetPort: admin}
