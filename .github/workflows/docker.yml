name: Docker images

# Every push and PR builds all 5 images (4 services + the migration
# runner) to catch a broken Dockerfile
# before it ships. Only push to origin/main (or a vNN.NN.NN tag) actually
# publishes to GHCR — a PR from a fork never gets registry credentials.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Objects rather than a bare list because the migration runner's
        # Dockerfile does not live under services/. It is built and tagged
        # alongside the services on purpose: the schema is part of a
        # release, so it should be promoted and rolled back with one tag
        # (see deploy/k8s/migrate-job.yaml).
        include:
          - {service: gateway,  dockerfile: services/gateway/Dockerfile}
          - {service: catalog,  dockerfile: services/catalog/Dockerfile}
          - {service: order,    dockerfile: services/order/Dockerfile}
          - {service: identity, dockerfile: services/identity/Dockerfile}
          - {service: migrate,  dockerfile: migrations/Dockerfile}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Lowercased explicitly: GHCR rejects uppercase in image names,
          # and the repo itself is QR-menu.
          images: ghcr.io/${{ github.repository_owner }}/qr-menu-${{ matrix.service }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build (and push on main/tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Bare-metal target is assumed amd64; add linux/arm64 here if a
          # node pool or local (Apple Silicon) workflow needs it.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
