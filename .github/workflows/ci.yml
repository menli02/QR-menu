name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build, vet, test
    runs-on: ubuntu-latest

    # A real Postgres, because the tests that matter most cannot be run
    # against anything else. Partial unique indexes used as concurrency
    # control, ON CONFLICT arbiters, compare-and-set UPDATEs, FOR UPDATE
    # SKIP LOCKED, JSONB merge semantics, the atomic order-number counter —
    # every one of those is behaviour Postgres provides, and a mock would
    # only re-assert what the mock was written to do.
    #
    # This is not hypothetical: the integration suite has already caught
    # four bugs that unit tests passed straight over (keyset-pagination
    # UUID typing, QR-key rotation ordering against the one-current-key
    # index, Postgres array/JSONB scanning, and a nullable sum() scan).
    # Until this job existed, none of those tests ran in CI at all.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: qrmenu
          POSTGRES_PASSWORD: qrmenu
          POSTGRES_DB: postgres
        ports:
          # 5437 on the host, matching deploy/docker-compose.yml, so the
          # DSNs in the tests are identical locally and in CI. A test that
          # needs a different connection string in CI is a test that will
          # eventually only pass in one of the two places.
          - 5437:5432
        options: >-
          --health-cmd "pg_isready -U qrmenu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The compose file does this with an entrypoint script; the service
      # container has no equivalent hook, so it is repeated here. Keep the
      # two in step — deploy/postgres-init/01-databases.sh is the original.
      - name: Create per-service databases
        env:
          PGPASSWORD: qrmenu
        run: |
          for db in catalog_db order_db identity_db; do
            psql -h 127.0.0.1 -p 5437 -U qrmenu -d postgres -v ON_ERROR_STOP=1 \
              -c "CREATE DATABASE $db OWNER qrmenu"
            psql -h 127.0.0.1 -p 5437 -U qrmenu -d "$db" -v ON_ERROR_STOP=1 \
              -c "CREATE EXTENSION IF NOT EXISTS pgcrypto"
          done

      - name: Install golang-migrate
        # Pinned to the version the migrations were authored and run
        # against locally.
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1

      - name: Apply migrations
        run: make migrate-up

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "::error::the following files are not gofmt'd (run 'make fmt'):"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # With Postgres up, the model-layer suites no longer skip. If the
      # database were unreachable they would skip silently and this job
      # would still pass, so the guard below asserts they actually ran.
      - name: go test
        run: go test ./... -race -cover

      - name: Assert the integration tests were not skipped
        run: |
          out="$(go test ./services/order/internal/model/ ./services/catalog/internal/model/ \
                        ./services/identity/internal/model/ ./pkg/outbox/ -count=1 -v 2>&1)"
          if echo "$out" | grep -q "not reachable"; then
            echo "::error::integration tests skipped — Postgres was not reachable, so this job proved nothing"
            echo "$out" | grep "not reachable" | head -5
            exit 1
          fi
          echo "$out" | grep -c '^--- PASS' | xargs echo "integration tests passed:"

  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Pinned to the version validated locally against this codebase
      # (0 issues on default linters). Bump deliberately, not silently.
      # The action major must track the linter major: v6 refuses a v2
      # linter outright ("golangci-lint v2 is not supported").
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.6.2

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Renders the kustomization and validates every resource against the
      # real API schemas. Catches the class of mistake that otherwise only
      # surfaces at `kubectl apply` against a live cluster: a misspelled
      # field, a resource nested wrongly, an API version that does not
      # exist.
      - name: Install kubeconform
        run: |
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform

      - name: Validate rendered manifests
        # 1.29 is the floor the manifests declare (the gateway's
        # preStop.sleep hook needs it). Validating at the floor rather than
        # at some newer version is the point: it fails if someone adds a
        # field the documented minimum cluster cannot accept.
        run: |
          kubectl kustomize deploy/k8s \
            | kubeconform -strict -summary -kubernetes-version 1.29.0 -

      - name: Validate the standalone manifests
        # Not in the kustomization — a Job is immutable once created, and
        # the secrets file is placeholders — but they still have to parse.
        run: |
          kubeconform -strict -summary -kubernetes-version 1.29.0 \
            deploy/k8s/migrate-job.yaml deploy/k8s/secrets.example.yaml

      - name: No real credentials in the committed manifests
        # secrets.example.yaml is meant to stay placeholders. This is a
        # cheap guard against the commit that fills it in "just to test
        # something" — a password in git stays in git.
        run: |
          if grep -rIEn '(password|secret|dsn|key)["'"'"']?\s*[:=]\s*["'"'"']?[A-Za-z0-9+/]{16,}' \
               deploy/k8s/ --include='*.yaml' | grep -v '<' ; then
            echo "::error::deploy/k8s appears to contain a literal credential"
            exit 1
          fi
          echo "no literal credentials found"

  proto:
    name: buf lint / breaking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.47.2"

      - name: buf lint
        run: buf lint

      # Only meaningful on a PR: compares this branch's proto/ against main
      # to catch wire-breaking contract changes (docs/TZ.md §8.2 treats
      # these as long-lived interfaces).
      - name: buf breaking (against main)
        if: github.event_name == 'pull_request'
        run: buf breaking --against '.git#branch=main'
